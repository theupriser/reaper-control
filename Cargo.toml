[workspace]
resolver = "3"
members = [
  "crates/shared-kernel",
  "crates/performance",
  "crates/catalogue",
  "crates/setlists",
  "crates/protocol",
  "crates/link",
  "crates/installer",
  "crates/app-core",
  "crates/midi",
  "crates/legacy-import",
  "crates/reaper-port",
  "crates/timer-loop",
  "crates/reaper-extension",
  "crates/app",
  "crates/architecture-tests",
]

[workspace.package]
version = "2.1.1"
edition = "2024"
license = "LicenseRef-MIT-Commons-Clause"
publish = false

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
midir = "0.11.0"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "std"] }
tracing-appender = "0.2"
shared-kernel = { path = "crates/shared-kernel" }
performance = { path = "crates/performance" }
catalogue = { path = "crates/catalogue" }
setlists = { path = "crates/setlists" }
protocol = { path = "crates/protocol" }
link = { path = "crates/link" }
installer = { path = "crates/installer" }
app-core = { path = "crates/app-core" }
midi = { path = "crates/midi" }
legacy-import = { path = "crates/legacy-import" }
reaper-port = { path = "crates/reaper-port" }
timer-loop = { path = "crates/timer-loop" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
dbg_macro = "deny"
large_enum_variant = "deny"
large_types_passed_by_value = "deny"
large_stack_arrays = "deny"
trivially_copy_pass_by_ref = "deny"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1

[workspace]
resolver = "3"
members = [
  "crates/shared-kernel",
  "crates/performance",
  "crates/catalogue",
  "crates/setlists",
  "crates/projections",
  "crates/protocol",
  "crates/link",
  "crates/reaper-port",
  "crates/timer-loop",
  "crates/reaper-extension",
  "crates/app",
  "crates/architecture-tests",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
midir = "0.11.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "std"] }
tracing-appender = "0.2"
shared-kernel = { path = "crates/shared-kernel" }
performance = { path = "crates/performance" }
catalogue = { path = "crates/catalogue" }
setlists = { path = "crates/setlists" }
projections = { path = "crates/projections" }
protocol = { path = "crates/protocol" }
link = { path = "crates/link" }
reaper-port = { path = "crates/reaper-port" }
timer-loop = { path = "crates/timer-loop" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
dbg_macro = "deny"

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1

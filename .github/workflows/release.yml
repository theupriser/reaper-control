name: Release

# A tag like v0.1.0 builds both platforms and publishes a release with both installers; a tag with a dash (v2.1.0-rc1)
# is marked as a pre-release (ADR-006: ad-hoc signed on macOS, unsigned on Windows, until accounts exist).
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag equals the workspace version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            bundle: target/release/bundle/dmg/*.dmg
            name: reaper-control-macos-arm64.dmg
          - os: windows-latest
            bundle: target/release/bundle/nsis/*-setup.exe
            name: reaper-control-windows-x64-setup.exe
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: UI install and build
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build
      - uses: Swatinem/rust-cache@v2
      - name: Build the extension (release)
        run: cargo build --release -p reaper-extension
      - name: Package the extension with its checksum
        shell: bash
        run: .github/scripts/package_extension.sh
      - name: Build the installer (macOS .dmg, Windows setup)
        shell: bash
        working-directory: crates/app
        env:
          CI: "true"
        run: ../../ui/node_modules/.bin/tauri build --features custom-protocol --config bundle.${{ startsWith(matrix.os, 'windows') && 'windows' || 'macos' }}.json
      - name: Name the installer and checksum it
        shell: bash
        run: |
          cp ${{ matrix.bundle }} "dist/${{ matrix.name }}"
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "${{ matrix.name }}" > "${{ matrix.name }}.sha256"; else shasum -a 256 "${{ matrix.name }}" > "${{ matrix.name }}.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            if [ -f "release-notes/$GITHUB_REF_NAME.md" ]; then
              cat "release-notes/$GITHUB_REF_NAME.md"
            else
              echo "No release notes were written for $GITHUB_REF_NAME."
            fi
            echo
            echo "### Not code-signed"
            echo "On macOS right-click the app and choose Open the first time. On Windows SmartScreen will warn (More info, Run anyway)."
          } > notes.md
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; *) prerelease="" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/reaper-control-macos-arm64.dmg dist/reaper-control-windows-x64-setup.exe \
            --repo "$GITHUB_REPOSITORY" \
            $prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md

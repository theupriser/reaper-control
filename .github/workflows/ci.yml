name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  interface-speed:
    name: Interface speed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: UI install
        run: pnpm --dir ui install --frozen-lockfile
      - name: Browser
        run: pnpm --dir ui exec playwright install --with-deps chromium
      - name: Input to paint budget
        run: pnpm --dir ui perf
      - name: Trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-speed-trace
          path: ui/perf-results
          if-no-files-found: ignore

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: UI install
        run: pnpm --dir ui install --frozen-lockfile
      - name: UI check
        run: pnpm --dir ui check
      - name: UI test
        run: pnpm --dir ui test
      - name: UI build (the Rust app embeds it at compile time)
        run: pnpm --dir ui build
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (includes architecture rules)
        run: cargo test --workspace

  fuzz:
    name: Fuzz protocol (30 s per target)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Nightly toolchain (cargo-fuzz needs sanitizers)
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/protocol/fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz decoder
        run: cargo +nightly fuzz run decoder -- -max_total_time=30
        working-directory: crates/protocol
      - name: Fuzz messages
        run: cargo +nightly fuzz run messages -- -max_total_time=30
        working-directory: crates/protocol

  package:
    name: Package (${{ matrix.os }})
    needs: rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - name: UI install and build
        run: |
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build
      - uses: Swatinem/rust-cache@v2
      - name: Build the extension (release)
        run: cargo build --release -p reaper-extension
      - name: Package the extension with its checksum
        shell: bash
        run: .github/scripts/package_extension.sh
      - name: Build the installer (macOS .dmg, Windows setup)
        shell: bash
        working-directory: crates/app
        env:
          CI: "true"
        run: ../../ui/node_modules/.bin/tauri build --features custom-protocol --config bundle.${{ startsWith(matrix.os, 'windows') && 'windows' || 'macos' }}.json
      - name: Installer file names
        shell: bash
        run: ls -l target/release/bundle/dmg/*.dmg target/release/bundle/nsis/*-setup.exe 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.os }}
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*-setup.exe

  reaper-smoke:
    name: REAPER smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build the extension (release)
        run: cargo build --release -p reaper-extension
      - name: Package the extension
        shell: bash
        run: .github/scripts/package_extension.sh
      - name: Build the link client examples (send_command, link_watch)
        run: cargo build --release -p link --examples
      - name: Install REAPER (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -fsSL -o "$RUNNER_TEMP/reaper.dmg" https://www.reaper.fm/files/7.x/reaper782_universal.dmg
          # the dmg opens with REAPER's licence agreement; installing it means accepting that
          echo Y | hdiutil attach "$RUNNER_TEMP/reaper.dmg" -nobrowse -mountpoint "$RUNNER_TEMP/reaper-volume" > /dev/null
          cp -R "$RUNNER_TEMP/reaper-volume/REAPER.app" "$RUNNER_TEMP/REAPER.app"
          hdiutil detach "$RUNNER_TEMP/reaper-volume"
          echo "REAPER_EXECUTABLE=$RUNNER_TEMP/REAPER.app/Contents/MacOS/REAPER" >> "$GITHUB_ENV"
      - name: Install REAPER (Windows, portable)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.reaper.fm/files/7.x/reaper782_x64-install.exe -OutFile "$env:RUNNER_TEMP\reaper-install.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\reaper-install.exe" -ArgumentList "/S", "/PORTABLE", "/D=$env:RUNNER_TEMP\REAPER" -Wait
          "REAPER_EXECUTABLE=$env:RUNNER_TEMP\REAPER\reaper.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: The extension starts, refuses strangers and keeps time inside REAPER
        shell: bash
        run: |
          extension=$(ls dist/reaper_rc2-*.dylib dist/reaper_rc2-*.dll 2>/dev/null | head -1 || true)
          [ -n "$extension" ] || { echo "no packaged extension in dist/"; exit 1; }
          testing/scripts/soak_short_project.sh "$PWD/soak-short.rpp"
          SMOKE_PROJECT="$PWD/soak-short.rpp" testing/scripts/smoke_extension.sh "$REAPER_EXECUTABLE" "$extension" \
            testing/scripts/security_check.sh testing/scripts/soak_short.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reaper-smoke-screen-${{ matrix.os }}
          path: screen.png
          if-no-files-found: ignore

  discover-windows-audio:
    name: Discover Windows audio (temporary)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Install REAPER (portable)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://www.reaper.fm/files/7.x/reaper782_x64-install.exe -OutFile "$env:RUNNER_TEMP\reaper-install.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\reaper-install.exe" -ArgumentList "/S", "/PORTABLE", "/D=$env:RUNNER_TEMP\REAPER" -Wait
      - name: Click through the audio setup
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          Add-Type @"
          using System; using System.Collections.Generic; using System.Runtime.InteropServices; using System.Text;
          public class W {
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc p, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumChildWindows(IntPtr h, EnumProc p, IntPtr l);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet=CharSet.Auto)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll", CharSet=CharSet.Auto)] static extern int GetClassName(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] static extern IntPtr SendMessage(IntPtr h, int m, IntPtr w, IntPtr l);
            static string Text(IntPtr h) { var s = new StringBuilder(256); GetWindowText(h, s, 256); return s.ToString(); }
            static string Class(IntPtr h) { var s = new StringBuilder(256); GetClassName(h, s, 256); return s.ToString(); }
            public static string Click(uint pid, string label) {
              var report = new List<string>(); IntPtr target = IntPtr.Zero;
              EnumWindows((h, l) => {
                uint p; GetWindowThreadProcessId(h, out p);
                if (p != pid || !IsWindowVisible(h)) return true;
                report.Add("window '" + Text(h) + "' class " + Class(h));
                EnumChildWindows(h, (c, m) => {
                  var t = Text(c).Replace("&", "");
                  if (Class(c) == "Button") report.Add("   button '" + t + "'");
                  if (Class(c) == "Button" && t == label) target = c;
                  return true; }, IntPtr.Zero);
                return true; }, IntPtr.Zero);
              if (target != IntPtr.Zero) { SendMessage(target, 0xF5, IntPtr.Zero, IntPtr.Zero); report.Add("clicked " + label); }
              return string.Join("\n", report);
            }
          }
          "@
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $i = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($i).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $i.Save("$PWD\$name.png")
          }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\cfg" | Out-Null
          "[reaper]`nvst_scan=2`nundomaxmem=0`n" | Out-File -Encoding ascii "$env:RUNNER_TEMP\cfg\reaper.ini"
          Start-Process "$env:RUNNER_TEMP\REAPER\reaper.exe" -ArgumentList "-cfgfile", "$env:RUNNER_TEMP\cfg\reaper.ini", "-newinst", "-nosplash"
          Start-Sleep 15
          Shot "1-start"
          Write-Host ([W]::Click([uint32]$reaper.Id, "Yes"))
          Start-Sleep 4
          Shot "2-after-yes"
          Get-Process reaper | Select-Object ProcessName, MainWindowTitle | Format-Table | Out-String | Write-Host
          Get-Content "$env:RUNNER_TEMP\cfg\reaper.ini" | Write-Host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discover-windows-audio
          path: "*.png"
          if-no-files-found: ignore

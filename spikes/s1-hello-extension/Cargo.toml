# Spike S1 (PLAN WP 1.1): does a Rust extension load into REAPER and run on the main-thread
# timer? Deliberately NOT part of the main workspace (own empty [workspace] table below), so it
# cannot affect CI or the lint wall. Throwaway code: the results go into docs/adr/ADR-001.
[package]
name = "s1-hello-extension"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
reaper-low = { git = "https://github.com/helgoboss/reaper-rs", rev = "659b22bfbc34bf4a5a40902e6fdf60ccfd34ca23" }
reaper-medium = { git = "https://github.com/helgoboss/reaper-rs", rev = "659b22bfbc34bf4a5a40902e6fdf60ccfd34ca23" }
reaper-macros = { git = "https://github.com/helgoboss/reaper-rs", rev = "659b22bfbc34bf4a5a40902e6fdf60ccfd34ca23" }

[workspace]

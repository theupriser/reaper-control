[package]
name = "reaper-extension"
version = "1.0.3"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shared-kernel.workspace = true
performance.workspace = true
catalogue.workspace = true
setlists.workspace = true
protocol.workspace = true
link.workspace = true
reaper-port.workspace = true
timer-loop.workspace = true
reaper-low = { git = "https://github.com/helgoboss/reaper-rs", rev = "659b22bfbc34bf4a5a40902e6fdf60ccfd34ca23" }
reaper-medium = { git = "https://github.com/helgoboss/reaper-rs", rev = "659b22bfbc34bf4a5a40902e6fdf60ccfd34ca23" }
serde_json.workspace = true
thiserror.workspace = true

[features]
# Test builds only: trigger files make the tick panic (`panic-main`) or stay slow (`slow-main`,
# every tick while the file exists), to prove the guard and the watchdog in a real REAPER.
fault-injection = []
# Test builds only: a `probe-command` file makes the adapter read and act, to check it in a real REAPER.
probe = []

# The only crate that may contain unsafe code (FFI boundary to REAPER, SPEC S-9).
# Keep it confined to one module; everything else stays safe.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
dbg_macro = "deny"

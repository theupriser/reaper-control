[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
protocol.workspace = true
link.workspace = true
performance.workspace = true
reaper-port.workspace = true
timer-loop.workspace = true
serde.workspace = true
thiserror.workspace = true
shared-kernel.workspace = true
serde_json.workspace = true
midir.workspace = true
sysinfo.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
zip = { version = "8.6.0", default-features = false, features = ["deflate", "time"] }
time = { version = "0.3", default-features = false, features = ["std"] }

[features]
# Set by `tauri build`, and by hand for a plain `cargo build --release`: embeds `ui/dist` instead of
# loading the dev server at `devUrl` (without it the window shows "localhost refused to connect").
custom-protocol = ["tauri/custom-protocol"]

[lints]
workspace = true

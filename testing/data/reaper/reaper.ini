; Starting config for the isolated REAPER in tests, so it never waits on a dialog:
; vst_scan: no VST scan at start; the audio keys: the default device, no audio prompt;
; undomaxmem=0: no undo history, which also turns off the "save changes?" prompt on close.
[reaper]
vst_scan=2
coreaudioindevnew=<default>
coreaudiooutdevnew=<default>
coreaudiosrate=48000
coreaudiobs=512
undomaxmem=0

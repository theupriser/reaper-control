<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="width: 240px; height: 800px; box-sizing: border-box; background: #121417; border-right: 1px solid #2A2E34; padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; color: #F2F3F4">

<div style="display: flex; align-items: center; gap: 12px; padding: 0 8px 24px 8px">
<div style="width: 36px; height: 36px; border-radius: 10px; background: #4CAF50; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#0A1A0B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h3l2-7 4 14 3-10 2 3h4"/></svg>
</div>
<div style="font-size: 16px; font-weight: 700; letter-spacing: 0.2px">Reaper Control</div>
</div>

<sc-for list="{{items}}" as="item" hint-placeholder-count="5">
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 600; min-height: 44px; box-sizing: border-box; background: {{item.bg}}; color: {{item.color}}">
<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.d}}"/></svg>
<span>{{item.label}}</span>
</a>
</sc-for>

<div style="flex: 1"></div>

<a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px 16px; border-radius: 12px; background: #4CAF50; color: #0A1A0B; font-size: 15px; font-weight: 800; text-decoration: none; min-height: 48px; box-sizing: border-box; margin-bottom: 16px">
<svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
Performer mode
</a>

<div style="background: #17191C; border: 1px solid #2A2E34; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700"><span style="width: 9px; height: 9px; border-radius: 50%; background: #4CAF50; display: block"></span>Connected to REAPER</div>
<div style="font-size: 13px; color: #9AA1A9; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">8 ms · script v2.0.0</div>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["player","setlists","checklist","settings","help"],"default":"player"},"$preview":{"width":240,"height":800}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'player';
const defs = [
{ id: 'player', label: 'Player', d: 'M5 3l14 9-14 9V3z' },
{ id: 'setlists', label: 'Setlists', d: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01' },
{ id: 'checklist', label: 'Pre-show check', d: 'M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11' },
{ id: 'settings', label: 'Settings', d: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6' },
{ id: 'help', label: 'Help', d: 'M12 22a10 10 0 100-20 10 10 0 000 20zM9.1 9a3 3 0 015.8 1c0 2-3 3-3 3M12 17h.01' }
];
return { items: defs.map(x => ({ ...x, bg: x.id === active ? '#1E2125' : 'transparent', color: x.id === active ? '#4CAF50' : '#C5CAD0' })) };
}
}
</script>
</body>
</html>
